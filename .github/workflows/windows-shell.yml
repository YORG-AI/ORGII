name: "Windows run_shell"

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - release
      - master
    paths:
      - ".github/workflows/windows-shell.yml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/crates/agent-core/Cargo.toml"
      - "src-tauri/crates/agent-core/src/core/providers/cursor_native/helpers.rs"
      - "src-tauri/crates/agent-core/src/core/tools/impls/coding/exec/**"
      - "src-tauri/crates/agent-core/src/foundation/security/policy/**"

jobs:
  powershell:
    name: Windows compile and PowerShell 5.1 host
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "ci-windows-agent-core-shell"

      # The full agent_core test executable currently fails before main() on
      # hosted Windows runners with STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139).
      # `cargo check --tests` still compiles every cfg(windows) production and
      # test path without depending on that unrelated test-host loader.
      - name: Compile Windows shell and test paths
        working-directory: src-tauri
        run: cargo check -p agent_core --tests

      - name: PowerShell 5.1 encoded-command host smoke
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $powershellPath = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          if (-not (Test-Path -LiteralPath $powershellPath)) {
            throw "Windows PowerShell 5.1 was not found at $powershellPath"
          }

          function Invoke-OrgiiEncodedCommand([string] $Source) {
            $sourcePayload = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($Source))
            $wrapper = @'
          $ErrorActionPreference = 'Stop'
          $__orgii_utf8 = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = $__orgii_utf8
          $OutputEncoding = $__orgii_utf8
          $__orgii_source = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String('__SOURCE_PAYLOAD__'))
          $global:LASTEXITCODE = 0
          & ([ScriptBlock]::Create($__orgii_source))
          $__orgii_success = $?
          $__orgii_exit_code = $global:LASTEXITCODE
          if ($__orgii_success) { exit 0 }
          if ($null -ne $__orgii_exit_code -and $__orgii_exit_code -ne 0) { exit $__orgii_exit_code }
          exit 1
          '@
            $wrapper = $wrapper.Replace("__SOURCE_PAYLOAD__", $sourcePayload)
            $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($wrapper))
            $output = & $powershellPath -NoLogo -NoProfile -NonInteractive -EncodedCommand $encoded
            [PSCustomObject]@{
              ExitCode = $LASTEXITCODE
              Output = $output -join "`n"
            }
          }

          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          # Windows PowerShell 5.1 reads a BOM-less .ps1 as the active ANSI
          # code page, so keep this workflow source ASCII and construct the
          # Unicode fixtures at runtime.
          $chinese = ([string][char]0x4E2D) + ([char]0x6587)
          $emoji = [char]::ConvertFromUtf32(0x1F642)
          $expectedText = "$chinese $emoji `"quoted`"; semicolon"
          $pathLeaf = "ORG2 $chinese path with spaces"
          $workDir = Join-Path $env:RUNNER_TEMP $pathLeaf
          New-Item -ItemType Directory -Force -Path $workDir | Out-Null
          Push-Location $workDir
          try {
            $source = @(
              "Write-Output '$expectedText'"
              'Write-Output (Get-Location).Path'
              'Write-Output (''PSVERSION='' + $PSVersionTable.PSVersion.Major)'
              'Write-Output (''PYTHONIOENCODING='' + $env:PYTHONIOENCODING)'
            ) -join "`n"
            $result = Invoke-OrgiiEncodedCommand $source
          } finally {
            Pop-Location
          }

          if ($result.ExitCode -ne 0) { throw "Unicode smoke exited $($result.ExitCode)" }
          if (-not $result.Output.Contains($expectedText)) { throw "Unicode output mismatch: $($result.Output)" }
          if (-not $result.Output.Contains($pathLeaf)) { throw "Working directory mismatch: $($result.Output)" }
          if ($result.Output -notmatch 'PSVERSION=5') { throw "PowerShell version mismatch: $($result.Output)" }
          if ($result.Output -notmatch 'PYTHONIOENCODING=utf-8') { throw "Python UTF-8 environment missing: $($result.Output)" }

          $nonzero = Invoke-OrgiiEncodedCommand "exit 7"
          if ($nonzero.ExitCode -ne 7) { throw "Expected exit code 7, got $($nonzero.ExitCode)" }
