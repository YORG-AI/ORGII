[package]
name = "conversation-portability"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
description = "Provider-neutral, content-preserving conversation checkpoint model for ORG2."
license = "AGPL-3.0-or-later"
readme = "README.md"
publish = false

[lib]
name = "conversation_portability"
path = "src/lib.rs"

[dependencies]
core_types = { path = "../types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ryu = "=1.0.23"
sha2 = "0.10"
