[package]
name = "agent_cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
description = "Tauri commands for reading/writing on-disk config files of external CLI agents."
publish = false

[lib]
name = "agent_cli"
path = "src/lib.rs"

[dependencies]
app_paths = { path = "../app-paths" }
app_platform = { path = "../app-platform" }
app_utils = { path = "../app-utils" }

# Tauri command macro surface only — no AppHandle / Manager / Emitter use.
tauri = { version = "=2.10.3", default-features = false }

rusqlite = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
json5 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3.13"
tokio = { workspace = true }
toml = "0.8"
tracing = "0.1"
