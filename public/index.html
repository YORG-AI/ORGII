      // #splash overlay element itself stays mounted so the startup watchdog
      // still has a host for its error panel if the bundle never comes up.
      // Tauri injects __TAURI_INTERNALS__ before page scripts, so the label

              ? internals.metadata.currentWindow.label

              "data-orgii-secondary-window",
              ""
            );
          }

          // Non-Tauri or unexpected internals shape: keep main-window behavior.
        }
      })();

      // frontend mirrors it into localStorage["theme"] on every change, so the
      // resolved scheme is readable synchronously here. Resolution order
      // matches resolveGlobalThemePreference() in
      // src/config/appearance/globalThemes.ts, including the legacy aliases and
      // the "absent or system -> follow the OS" fallback.
      //

      // --color-fill-1 in public/orgii_{main,dark}.css. When a non-baseline

      // ORGII's own palette before the skin paints.
      // ---------------------------------------------------------------------

        var PALETTES = {
          light: {
            bg: "#ffffff",
            fg: "#1d2129",
            muted: "#86909c",
            panelBg: "#f5f5f5",
            panelBorder: "#e3e3e3",
            // Dark ink on a light field reads heavier than the inverse, so the
            // light mark needs slightly more alpha to look equally quiet.
            markOpacity: "0.6",
          },
          dark: {
            bg: "#141414",
            fg: "#e8e8e8",
            muted: "#8b8b8d",
            panelBg: "#1f1f1f",
            panelBorder: "#2e2e2e",
            markOpacity: "0.5",

          stored === "orgii-high-contrast" ||
          stored === "/orgii_high_contrast.css" ||
          stored === "dark" ||
          stored === "/orgii_dark.css"

          stored === "github-light" ||
          stored === "light" ||
          stored === "/orgii_main.css"

              ? "dark"

            localStorage.getItem("orgii_skin_surface") || "null"

              bg: skinPalette.bg,
              fg: skinPalette.fg,
              muted: palette.muted,
              panelBg: skinPalette.panelBg || palette.panelBg,
              panelBorder: skinPalette.panelBorder || palette.panelBorder,
              markOpacity: palette.markOpacity,

        html.style.setProperty("--splash-fg", palette.fg);
        html.style.setProperty("--splash-fg-muted", palette.muted);

        html.style.setProperty("--splash-panel-border", palette.panelBorder);
        html.style.setProperty("--splash-mark-opacity", palette.markOpacity);
        html.style.colorScheme = key === "light" ? "light" : "dark";
      })();
    </script>
    <script nonce="orgii-codemirror-style">

      // The splash (#splash) is normally removed only when React commits its
      // first paint. If the bundle fails to parse/execute, hangs, or enters an
      // infinite chunk-reload loop, that signal never arrives and the user is
      // stranded on the logo forever. This watchdog is fully self-contained
      // (no bundle dependency) so it fires even when nothing else runs.
      //

      // ---------------------------------------------------------------------

            "[Startup +" + elapsedMs + "ms] " + label,
            details || ""

            // mark alone); local dev reveals it to surface startup timings.

    <style nonce="orgii-codemirror-style">
      /*
       * Everything here lives in `@layer base` so Tailwind v4 utilities
       * (which are emitted in `@layer utilities`) keep beating the splash
       * preflight. Unlayered, the `* { margin: 0; padding: 0 }` reset
       * below would override every padding/margin utility in the app —
       * unlayered author styles always beat layered ones.
       */
      @layer base {
      :root {
        --border-radius-window: 10px;
        /*
         * Splash palette fallbacks for the case where the preflight script
         * above never runs (blocked inline script, stripped nonce). Light
         * values here, dark ones in the media query below, so the splash still
         * follows the OS scheme without JS. The preflight overrides both with
         * inline custom properties on <html> once it resolves the persisted
         * theme.
         */

        --splash-fg: #1d2129;
        --splash-fg-muted: #86909c;
        --splash-panel-bg: #f5f5f5;
        --splash-panel-border: #e3e3e3;
        --splash-mark-opacity: 0.6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --splash-bg: #141414;
          --splash-fg: #e8e8e8;
          --splash-fg-muted: #8b8b8d;
          --splash-panel-bg: #1f1f1f;
          --splash-panel-border: #2e2e2e;
          --splash-mark-opacity: 0.5;

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;

       * `* { user-select: none }` above otherwise disables Cmd+A /
       * Ctrl+A inside <input>, <textarea>, and contenteditable
       * surfaces across the whole app. This preflight rule keeps
       * selectAll working during the splash window before the main
       * stylesheet's matching block (in src/index.scss) loads.

      textarea,
      select,
      [contenteditable=""],
      [contenteditable="true"],
      [contenteditable="plaintext-only"] {
        user-select: text !important;
        -webkit-user-select: text !important;

      html,
      body,
      #root {
        height: 100%;

         * The window is opaque until the bundle calls remove_window_background,
         * so the pre-bundle surface must paint the app's own background rather
         * than a fixed dark plate — otherwise a light-theme launch flashes
         * black. Mirrors `html { background: var(--color-bg-2) }` in
         * src/index.scss, which takes over as soon as the theme CSS loads.

        border-radius: var(--border-radius-window);
        overflow: hidden;

      html.fullscreen,
      html.fullscreen body,
      html.fullscreen #root,
      html.fullscreen #splash {
        border-radius: 0 !important;
      }
      /*
       * The splash is a bare overlay: it paints no background of its own, so
       * the app background shows through and there is nothing to fade at first
       * paint — the element is simply removed. Only the mark and its circular
       * loading trail are visible.
       */

        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border-radius: var(--border-radius-window);
        z-index: 99999;

       * overlay stays for the watchdog's error panel, but nothing is drawn
       * on the happy path. See the secondary-window preflight script.

      html[data-orgii-secondary-window] #splash-comet,
      html[data-orgii-secondary-window] #splash-text {
        display: none;
      }
      /*
       * A 216-degree (60%) trail traces a circle around the stationary glyph.
       * The gradient fades from the tail to a round leading head; they share
       * one transform animation, so drawing needs no JavaScript frame loop.

        position: absolute;
        width: 204px;
        height: 204px;
        border-radius: 50%;
        color: var(--splash-fg);
        opacity: var(--splash-mark-opacity);
        pointer-events: none;
        animation: splash-comet-orbit 1.8s linear infinite;
        animation-play-state: paused;

      #splash-comet::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: conic-gradient(
          from -216deg,
          transparent 0deg,
          currentColor 216deg,
          transparent 216deg

        -webkit-mask-image: radial-gradient(
          farthest-side,
          transparent calc(100% - 2px),
          #000 calc(100% - 1.5px)

        mask-image: radial-gradient(
          farthest-side,
          transparent calc(100% - 2px),
          #000 calc(100% - 1.5px)

      #splash-comet::after {
        content: "";
        position: absolute;
        top: 1px;
        left: 50%;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
        transform: translate(-50%, -50%);

      @media (prefers-reduced-motion: reduce) {

          animation: none;

       * and held well below full strength so it reads as a quiet watermark on
       * the app background rather than a solid logo.

      #splash-logo {
        width: auto;
        height: 112px;
        color: var(--splash-fg);
        opacity: var(--splash-mark-opacity);
        pointer-events: none;
      }
      /*
       * Hidden in normal use. markStartup() (local dev only) reveals it to
       * report startup phase timings under the mark.

      #splash-text {
        display: none;
        position: absolute;
        bottom: 24px;
        left: 0;
        right: 0;
        text-align: center;
        color: var(--splash-fg-muted);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
        font-weight: 400;
        letter-spacing: 0.5px;
      }
      #splash-text .dots {
        display: inline-block;
        width: 18px;
        text-align: left;
      }
      @keyframes dots {
        0%,
        20% {
          content: ".";
        }
        40% {
          content: "..";
        }
        60%,
        100% {
          content: "...";
        }
      }
      #splash-text .dots::after {
        content: ".";
        animation: dots 1.5s steps(1) infinite;
      }
      }
    </style>
  </head>
